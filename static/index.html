<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agent Factory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <span class="brand-mark">⚙</span>
        <div>
          <h1>Agent Factory</h1>
          <p class="subtitle">Local sessions, local model</p>
        </div>
      </div>
      <div id="repo-chips" class="repo-chips"></div>
    </header>

    <main>
      <section id="session-list-pane">
        <div class="list-pane-header">
          <button type="button" id="btn-new-session" class="btn-primary btn-block">+ New session</button>
        </div>
        <div id="session-rows"></div>
        <div id="session-empty" class="empty-state hidden">
          No sessions yet — start one above.
        </div>
      </section>

      <section id="detail-pane">
        <div id="detail-empty" class="empty-state">Select a session, or start a new one.</div>

        <!-- draft compose mode: shown for an unsaved new session -->
        <div id="compose-content" class="hidden">
          <h2 class="compose-heading">New session</h2>
          <textarea id="compose-prompt" placeholder="What do you want to ask or build?" autofocus></textarea>
          <div class="compose-row">
            <label for="compose-repo">Repo</label>
            <select id="compose-repo">
              <option value="">No repo</option>
            </select>
          </div>
          <div class="compose-actions">
            <button type="button" id="btn-start-ask" class="btn-primary">Ask</button>
            <button type="button" id="btn-start-code" class="btn-primary btn-code">Code</button>
          </div>
          <p class="compose-hint">Nothing is saved until you hit Ask or Code.</p>
        </div>

        <!-- normal session mode -->
        <div id="detail-content" class="hidden">
          <div id="detail-header">
            <div>
              <span id="detail-type-pill" class="pill"></span>
              <span id="detail-ref" class="ref"></span>
              <h2 id="detail-title"></h2>
            </div>
            <div id="detail-meta"></div>
          </div>

          <div id="detail-actions">
            <button id="btn-stop" class="btn-danger hidden">Stop</button>
            <button id="btn-close" class="btn-ghost">Close</button>
            <button id="btn-archive" class="btn-ghost">Archive</button>
            <button id="btn-reopen" class="btn-ghost">Reopen</button>
          </div>

          <pre id="detail-logs"></pre>
          <form id="message-form">
            <textarea id="message-text" placeholder="Message the agent…"></textarea>
            <button type="submit" class="btn-primary">Send</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
